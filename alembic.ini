# Alembic configuration for the NovaIAx gateway.
# Database URL is read from the application's settings (see
# ``migrations/env.py``), which in turn reads ``DATABASE_URL`` from the
# environment / ``.env`` file — so the URL is NOT hardcoded here.

[alembic]
# Path to migration scripts.
script_location = migrations

# Template used to generate new revision files in
# ``migrations/versions/``.
file_template = %%(rev)s_%%(slug)s

# Logging configuration used by the ``alembic`` CLI.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s