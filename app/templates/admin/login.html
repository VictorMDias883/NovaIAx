<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · NovaIAx Console</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/admin.js" nonce="{{ csp_nonce }}" defer></script>
</head>
<body>
  <main class="auth-card card">
    <h1>NovaIAx Console</h1>
    <p class="muted auth-sub">Acesso restrito a administradores.</p>
    {% if error %}
      <div class="flash flash-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      {% if totp_required %}
      <div class="form-group">
        <label for="totp_code">Código de verificação (2FA)</label>
        <input type="text" id="totp_code" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]*" maxlength="7" placeholder="000000">
      </div>
      {% endif %}
      <button type="submit" class="btn">Entrar</button>
    </form>
  </main>
</body>
</html>
