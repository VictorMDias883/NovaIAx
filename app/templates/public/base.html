<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NovaIAx{% endblock %}</title>
  <style>
    :root { --text: #1f2937; --muted: #6b7280; --accent: #2563eb; --bg: #f9fafb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
    .topnav { background: #111827; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .topnav .brand { font-weight: 700; }
    .topnav a { color: #cbd5e1; text-decoration: none; margin-left: 1rem; }
    .topnav a:hover { color: #fff; }
    .container { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    .muted { color: var(--muted); }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.5rem; margin: 1.5rem 0; }
    .error { color: #dc2626; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; }
    th { color: var(--muted); font-weight: 600; }
    input[type=email], input[type=password] { width: 100%; padding: 0.6rem; margin: 0.25rem 0 1rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    button { background: var(--accent); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { opacity: 0.92; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 3rem 0 1.5rem; }
  </style>
</head>
<body>
  <nav class="topnav">
    <span class="brand">NovaIAx</span>
    <div class="links">
      <a href="/privacy">Privacidade</a>
      <a href="/terms">Termos</a>
      <a href="/account-deletion">Excluir conta</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>NovaIAx · Documentos de transparência e controles do titular de dados.</footer>
</body>
</html>
