services:
  postgres:
    image: postgres:17
    container_name: novaiax-postgres
    environment:
      POSTGRES_DB: novaiax
      POSTGRES_USER: novaiax
      POSTGRES_PASSWORD: novaiax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: novaiax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
