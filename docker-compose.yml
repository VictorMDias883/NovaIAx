# NovaIAx full stack: Postgres + Redis + API gateway.
# Mirrors the services defined in docker-compose.data.yml (data) and
# docker-compose.dev.yml (api) so ``docker compose up --build`` boots
# the entire stack with a single command.
services:
  postgres:
    image: postgres:17
    container_name: novaiax-postgres
    environment:
      POSTGRES_DB: novaiax
      POSTGRES_USER: novaiax
      POSTGRES_PASSWORD: novaiax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaiax -d novaiax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novaiax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: novaiax-api
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: