# Render Blueprint configuration for the NovaIAx gateway.
# Reference: https://render.com/docs/blueprint-spec
#
# Infrastructure provisioned on first Blueprint sync:
#   - A Docker-based web service (builds the existing Dockerfile as-is).
#     Render injects ``PORT`` (never hardcoded here); ``entrypoint.sh`` binds
#     uvicorn to ``${PORT:-8000}`` with ``--proxy-headers`` and
#     ``--forwarded-allow-ips='*'`` so client IPs survive Render's edge proxy.
#     ``/health`` is the health check path.
#   - A managed PostgreSQL database whose connection string is injected into
#     the web service's ``DATABASE_URL`` automatically via ``fromDatabase``.
#   - Redis is NOT part of this file: Render's free tier has no managed
#     Redis (Postgres only).  We keep Upstash Redis as planned — its
#     connection string is provided manually as the ``REDIS_URL`` secret.
#
# Region: ``virginia`` (US East).  Render has no São Paulo region; current
# regions are ``oregon | ohio | virginia | frankfurt | singapore``.  The
# US East coast is the lowest-latency hop to Brazil's backbone, so
# ``virginia`` is the closest of the available options for a Brazil-centric
# user base.
#
# Plan: ``free``.  The free web service spins down after 15 min of idle
# traffic and cold-starts in ~30-60s on the next request.  Swap ``free`` for
# ``0.5c-512mb`` (Starter) to remove spin-down entirely.
#
# Migrations: the container entrypoint (``entrypoint.sh``) runs
# ``alembic upgrade head`` before starting uvicorn (skip with
# ``RUN_MIGRATIONS=false``).  Render's native ``preDeployCommand`` is
# paid-plan-only, so it is intentionally not used while the service is on
# the free plan (see DEPLOY.md → § 5 for the upgrade path).
#
# Every production requirement in ``app/core/config.py``'s
# ``_validate_production_secrets`` is satisfied below: SECRET_KEY
# (generated), MASTER_API_KEY, at least one AI provider (GROQ_API_KEY),
# DATABASE_URL (fromDatabase), REDIS_URL and a valid
# GOOGLE_PLAY_PACKAGE_NAME — so the app does not abort at boot.

services:
  - type: web
    name: novaiax-gateway
    runtime: docker
    region: virginia
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      # ── Non-secret configuration (safe to commit) ────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: RATE_LIMIT_DEFAULT
        value: "60"
      - key: RATE_LIMIT_AI
        value: "10"
      - key: CACHE_TTL_DEFAULT
        value: "60"
      - key: CACHE_TTL_AI
        value: "300"
      - key: MAX_PAYLOAD_BYTES
        value: "1048576"
      # Trust the edge proxy's X-Forwarded-For when resolving the client IP
      # for rate limiting.  Render's proxy overwrites this header for every
      # request (single trusted hop), so it cannot be spoofed from outside.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Android application id used by purchase verification and the RTDN
      # push endpoint; must be a syntactically valid package name in
      # production (checked by _validate_production_secrets).
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: br.com.novaiax.agente

      # ── Database: auto-injected connection string ─────────────────────────
      # Render fills DATABASE_URL with the managed Postgres connection
      # string (``postgresql://...``).  SQLAlchemy async accepts this scheme
      # (normalised to ``postgresql+asyncpg://`` in app/core/config.py);
      # no manual rewriting is needed (unlike Fly's asyncpg-only URLs).
      - key: DATABASE_URL
        fromDatabase:
          name: novaiax-db
          property: connectionString

      # ── Secrets (prompted in the dashboard on first sync; never stored) ──
      # Render asks for each of these during the initial Blueprint creation
      # flow and keeps the values out of this repo.  On Blueprint *updates*
      # Render ignores ``sync: false`` entries — set/rotate values from the
      # service's Environment page in the dashboard.
      # SECRET_KEY is the exception: Render generates a strong random value
      # on first sync (generateValue), so no manual input is needed.
      - key: SECRET_KEY
        generateValue: true
      # Alembic target.  Optional: when unset, migrations use DATABASE_URL.
      # With Supabase set the Supavisor SESSION-mode URL (pooler host,
      # port 5432, IPv4) — never the transaction pooler (6543) and not the
      # IPv6-only direct host (see DEPLOY.md → § 10).
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Upstash Redis connection string (``rediss://...``).  Render has no
      # free managed Redis, so this points at our external Upstash instance.
      - key: REDIS_URL
        sync: false
      # AI providers — at least one key is mandatory in production.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDERS_JSON
        sync: false
      # Bypass key trusted by every request — required in production.
      - key: MASTER_API_KEY
        sync: false
      # Operator account created automatically by the API on the first boot.
      # Set the e-mail and a strong password (>= 12 characters) in the
      # dashboard, log in at /admin/login and then remove both variables:
      # the password is applied only when the account is created.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Display name of the bootstrapped account.
      - key: ADMIN_BOOTSTRAP_NAME
        value: Administrador
      # Promote an existing (non-admin) account with the same e-mail to
      # ADMIN.  Off: an existing account is never modified.
      - key: ADMIN_BOOTSTRAP_PROMOTE_EXISTING
        value: "false"
      # Google Play billing verification (optional — billing is inert
      # without the service-account key).
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PRODUCTS_JSON
        sync: false
      - key: GOOGLE_PLAY_RTDN_TOKEN
        sync: false
      - key: GOOGLE_PLAY_RTDN_AUDIENCE
        sync: false

databases:
  - name: novaiax-db
    plan: free
    region: virginia
